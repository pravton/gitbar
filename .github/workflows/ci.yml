name: CI

# Runs when something lands on main (merge, direct push), on PRs targeting
# main or a release/* branch, plus a weekly cron for the dependency audit
# (see below). PR runs were added once the repo went public: Actions
# minutes are free for public repos, so the original "main only, to save
# minutes" rule no longer pays for itself, and a release PR should be
# validated before it merges rather than after. The pre-commit hook is
# still the per-commit gate.
#
# The `paths-ignore` filter on push and pull_request means doc-only
# changes skip the work entirely. The whole workflow can also be triggered
# manually from the Actions tab via `workflow_dispatch`.
#
# Weekly cron: under the release-branch dev pattern, main is pushed only
# at version-cut time, which could mean weeks between runs. The cron
# fires the dependency-audit job (frontend / rust jobs gate themselves
# off `github.event_name != 'schedule'`) so newly-disclosed advisories
# on pinned transitive deps surface even between releases. Monday at
# 14:00 UTC = morning in the US so a maintainer checking on a green
# status at the start of the week sees the result.
on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.githooks/**'
      - 'docs/**'
      - 'artifacts/**'
  pull_request:
    branches: [main, 'release/**']
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.githooks/**'
      - 'docs/**'
      - 'artifacts/**'
  workflow_dispatch:
  schedule:
    - cron: '0 14 * * 1'

concurrency:
  # Scoped by event_name too so the weekly schedule run (which shares
  # main's ref with push-triggered runs) can't cancel, or be cancelled
  # by, a real push's CI validation.
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (build + test)
    # Skip on the weekly schedule: if nothing pushed, the lockfile didn't
    # move, so rerunning Vitest would just spend minutes proving the same
    # commit still passes. Only the audit job is doing time-sensitive work.
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install
        run: npm ci

      - name: Type-check + build
        run: npm run build

      - name: Lint
        run: npm run lint

      - name: Vitest
        run: npm test

  rust:
    name: Rust (check + test)
    # Same rationale as `frontend`: nothing to check on the cron when the
    # tree hasn't moved.
    if: github.event_name != 'schedule'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: cargo check
        run: cargo check --manifest-path src-tauri/Cargo.toml

      # Match what `npm run test:rust` runs locally so a green local run
      # implies a green CI run.
      - name: cargo test
        run: cargo test --manifest-path src-tauri/Cargo.toml

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install
        run: npm ci

      - name: npm audit (production only)
        run: npm audit --omit=dev --audit-level=moderate

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      # Tauri pulls in transitive `gtk-*`/`glib`/`unic-*`/`proc-macro-error`
      # crates with unmaintained-crate advisories. They only apply to Linux
      # builds (or affect crates that have safe replacements upstream);
      # this repo targets macOS. Ignore them so the job doesn't go red over
      # upstream maintenance churn. RUSTSEC-2026-0194/0195 (quick-xml
      # 0.37) arrive only via tauri-plugin-notification -> notify-rust ->
      # tauri-winrt-notification, a Windows-only dependency that is never
      # compiled for macOS; drop them once notify-rust moves past 0.37.
      # RUSTSEC-2026-0367/0368/0369 (zip 4.x extraction issues) are the
      # same story: tauri-plugin-updater only depends on zip under
      # cfg(target_os = "windows"), to unpack Windows update bundles, so
      # it's absent from the macOS build. Drop them once the updater moves
      # to zip >= 9.
      # `cargo audit` reads `Cargo.lock` via `-f`; it doesn't accept
      # `--manifest-path`.
      - name: cargo audit
        run: |
          cargo audit -f src-tauri/Cargo.lock \
            --ignore RUSTSEC-2024-0370 \
            --ignore RUSTSEC-2024-0411 \
            --ignore RUSTSEC-2024-0412 \
            --ignore RUSTSEC-2024-0413 \
            --ignore RUSTSEC-2024-0414 \
            --ignore RUSTSEC-2024-0415 \
            --ignore RUSTSEC-2024-0416 \
            --ignore RUSTSEC-2024-0417 \
            --ignore RUSTSEC-2024-0418 \
            --ignore RUSTSEC-2024-0419 \
            --ignore RUSTSEC-2024-0420 \
            --ignore RUSTSEC-2024-0429 \
            --ignore RUSTSEC-2025-0075 \
            --ignore RUSTSEC-2025-0080 \
            --ignore RUSTSEC-2025-0081 \
            --ignore RUSTSEC-2025-0098 \
            --ignore RUSTSEC-2025-0100 \
            --ignore RUSTSEC-2026-0194 \
            --ignore RUSTSEC-2026-0195 \
            --ignore RUSTSEC-2026-0367 \
            --ignore RUSTSEC-2026-0368 \
            --ignore RUSTSEC-2026-0369
