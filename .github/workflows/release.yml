name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build macOS DMG
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install
        run: npm ci

      - name: Detect signing key availability
        # tauri.conf.json sets `bundle.createUpdaterArtifacts: true`, so by
        # default the bundler hard-errors when TAURI_SIGNING_PRIVATE_KEY
        # is unset (the matching pubkey is committed; an unsigned bundle
        # wouldn't verify against it anyway). Forks cutting their first
        # release won't have the secret, so we detect its presence here
        # and pass a config override below to skip updater artifacts when
        # absent. The DMG itself still ships; only the auto-update path
        # is disabled for that release.
        id: signing
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -n "$KEY" ]; then
            echo "has_key=true" >> "$GITHUB_OUTPUT"
            echo "args=--target universal-apple-darwin" >> "$GITHUB_OUTPUT"
          else
            echo "has_key=false" >> "$GITHUB_OUTPUT"
            # Inline JSON config override turns off updater artifacts so
            # the bundler doesn't demand a signing key.
            echo 'args=--target universal-apple-darwin --config {"bundle":{"createUpdaterArtifacts":false}}' >> "$GITHUB_OUTPUT"
            echo "::warning::TAURI_SIGNING_PRIVATE_KEY not set. Building without updater artifacts; auto-update will not work for users on this release. See RELEASING.md to wire up signing."
          fi

      - name: Build + bundle
        # tauri-action builds, bundles, and uploads artifacts to the
        # release matching the pushed tag. Universal binary so both
        # Apple Silicon and Intel Macs work from one DMG.
        #
        # With TAURI_SIGNING_PRIVATE_KEY set, tauri-action also produces
        # the .app.tar.gz + signature and a latest.json so the updater
        # endpoint configured in tauri.conf.json resolves. Without the
        # secret, the previous step swapped in a --config override
        # disabling updater artifacts so the build still succeeds.
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'GitBar ${{ github.ref_name }}'
          releaseDraft: true
          prerelease: false
          args: ${{ steps.signing.outputs.args }}
